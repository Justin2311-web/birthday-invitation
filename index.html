<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff0f5"><title>11月23日生日邀请</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff0f5;color:#55434b;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{width:min(100%,520px)}.card{background:rgba(255,255,255,.88);border:1px solid #f7dce7;border-radius:16px;padding:30px 22px;text-align:center;box-shadow:0 8px 28px #e9b6c522}.avatar{margin:0 auto 16px;width:76px;height:76px;border-radius:50%;background:#fbe5ef;display:grid;place-items:center;font-size:38px;position:relative}.avatar:after{content:'♡';position:absolute;right:-7px;top:-7px;color:#e77da9;font-size:24px}h1{font-size:23px;color:#d85b98;margin:0 0 10px;font-weight:700}p{font-size:13px;color:#927e87;line-height:1.8;margin:0 auto 22px}.buttons{display:flex;justify-content:center;gap:14px;align-items:center;min-height:46px;position:relative}.btn{border:0;border-radius:24px;padding:11px 25px;font-size:14px;cursor:pointer;white-space:nowrap}.yes{background:#e96ca7;color:white;box-shadow:0 4px 10px #e96ca733}.no{background:#eee;color:#777;transition:left .18s,top .18s;position:relative}.note{font-size:10px;margin-top:18px;color:#b3a1a8}.hidden{display:none!important}.step-title{font-size:20px;color:#d85b98;margin-bottom:8px}.field{margin:18px auto;text-align:left;max-width:330px}.field label{display:block;color:#8f7782;font-size:12px;margin-bottom:8px}.options{display:grid;gap:10px}.option{border:1px solid #f0d3df;border-radius:10px;padding:13px;background:white;text-align:left;color:#66525c;cursor:pointer}.option.active{border-color:#e96ca7;background:#fff1f7}.option b{display:block;font-size:14px;margin-bottom:4px}.option small{font-size:11px;color:#9d8992}.next{margin-top:16px}.invite{background:#fff8fb;border:1px solid #efc9da;border-radius:12px;padding:26px 18px;margin-top:15px}.invite .big{font-size:24px;color:#d85b98;margin:12px 0}.detail{font-size:13px;color:#6d5962;line-height:2}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}.actions .btn{font-size:12px;padding:10px 15px}.back{border:0;background:transparent;color:#a18d96;font-size:12px;cursor:pointer;margin-top:15px}.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;top:-30px;animation:fall 2.6s linear forwards;color:#e96ca7}@keyframes fall{to{transform:translateY(110vh) rotate(330deg);opacity:0}}@media(max-width:420px){.card{padding:26px 16px}h1{font-size:21px}.btn{padding:11px 22px}}
</style></head><body><div class="hearts" id="hearts"></div><main class="wrap"><section class="card" id="inviteStart"><div class="avatar">🐻</div><h1>我生日是 11 月 23 号！</h1><p>我打算去 KL 蹭生日优惠，想邀请你陪我一起过生日～</p><div class="buttons" id="buttonArea"><button class="btn yes" id="yes">愿意</button><button class="btn no" id="no">再想想</button></div><div class="note">做个选择吧 ♡</div></section>
<section class="card hidden" id="success"><div class="avatar">💗</div><h1>太好啦！就这么说定了！</h1><p>那我们来选一下生日安排吧～</p><button class="btn yes" id="startPlan">继续</button></section>
<section class="card hidden" id="dateStep"><div class="avatar">🗓️</div><div class="step-title">你什么时候有空呀？</div><p>日期和时间就这两个选择哦</p><div class="options"><button class="option" data-date="2026年11月21日（周六） · 下午2:00"><b>11月21日（周六）</b><small>下午 2:00</small></button><button class="option" data-date="2026年11月22日（周日） · 上云顶"><b>11月22日（周日）</b><small>上云顶 ☁️</small></button></div><button class="btn yes next" id="dateNext">确定时间</button></section>
<section class="card hidden" id="planStep"><div class="avatar">🎈</div><div class="step-title">生日节目怎么安排？</div><p>你选一个就好！</p><div class="options"><button class="option" data-plan="你安排"><b>你安排</b><small>我负责期待就好 😆</small></button><button class="option" data-plan="我安排"><b>我安排</b><small>交给我来计划</small></button></div><button class="btn yes next" id="makeCard">生成邀请卡</button></section>
<section class="card hidden" id="finalStep"><div class="avatar">🎂</div><h1>我们的生日约定</h1><p>专属生日邀请卡</p><div class="invite" id="inviteCard"><div>♡ 生日邀请 ♡</div><div class="big">要一起庆祝呀！</div><div class="detail" id="details"></div><div style="margin-top:14px;color:#d85b98">期待这一天 ♡</div></div><div class="actions"><button class="btn yes" id="save">保存 PNG</button><button class="btn" style="background:#f8e5ee;color:#9b5d79" id="share">分享邀请</button></div><button class="back" id="restart">重新选择</button></section></main>
<script>
const $=id=>document.getElementById(id);let chosenDate='',chosenPlan='';function show(id){['inviteStart','success','dateStep','planStep','finalStep'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function celebrate(){for(let i=0;i<32;i++){let h=document.createElement('span');h.className='heart';h.textContent=['♥','♡','💗'][i%3];h.style.left=Math.random()*100+'%';h.style.animationDelay=Math.random()*.9+'s';h.style.fontSize=(14+Math.random()*17)+'px';$('hearts').appendChild(h);setTimeout(()=>h.remove(),3600)}}$('yes').onclick=()=>{show('success');celebrate()};$('startPlan').onclick=()=>show('dateStep');const no=$('no'),area=$('buttonArea');function dodge(){const a=area.getBoundingClientRect(),b=no.getBoundingClientRect();no.style.position='absolute';no.style.left=Math.max(0,Math.random()*Math.max(1,a.width-b.width))+'px';no.style.top=(Math.random()*18-5)+'px'}no.addEventListener('mouseenter',dodge);no.addEventListener('touchstart',e=>{e.preventDefault();dodge()},{passive:false});no.addEventListener('click',dodge);
document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-date]').forEach(x=>x.classList.remove('active'));b.classList.add('active');chosenDate=b.dataset.date});$('dateNext').onclick=()=>{if(!chosenDate){alert('先选择一个日期哦');return}show('planStep')};document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-plan]').forEach(x=>x.classList.remove('active'));b.classList.add('active');chosenPlan=b.dataset.plan});$('makeCard').onclick=()=>{if(!chosenPlan){alert('先选择节目安排哦');return}$('details').innerHTML='<b>日期：</b>'+chosenDate+'<br><b>节目：</b>'+chosenPlan;show('finalStep')};$('restart').onclick=()=>show('dateStep');
$('save').onclick=()=>{const c=document.createElement('canvas');c.width=900;c.height=1100;const x=c.getContext('2d');x.fillStyle='#fff0f5';x.fillRect(0,0,900,1100);x.fillStyle='#fffafd';x.fillRect(65,65,770,970);x.strokeStyle='#efbfd3';x.lineWidth=3;x.strokeRect(85,85,730,930);x.textAlign='center';x.fillStyle='#d85b98';x.font='42px sans-serif';x.fillText('♡ 生日邀请 ♡',450,230);x.font='bold 58px sans-serif';x.fillText('要一起庆祝呀！',450,355);x.fillStyle='#6d5962';x.font='30px sans-serif';x.fillText('日期：'+chosenDate,450,500);x.fillText('节目：'+chosenPlan,450,590);x.fillStyle='#d85b98';x.font='32px sans-serif';x.fillText('期待这一天 ♡',450,760);const a=document.createElement('a');a.download='生日邀请卡.png';a.href=c.toDataURL('image/png');a.click()};$('share').onclick=async()=>{const text='生日邀请 ♡\n日期：'+chosenDate+'\n节目：'+chosenPlan+'\n期待这一天！';if(navigator.share){try{await navigator.share({title:'生日邀请',text})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('邀请内容已复制，可以分享给她啦！')}else alert(text)};
</script></body></html>
